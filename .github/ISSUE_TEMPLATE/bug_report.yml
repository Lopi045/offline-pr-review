name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `python app.py 8731`
        2. Open a PR from repo X
        3. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release tag or `git rev-parse --short HEAD`
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows, macOS, Linux]
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Terminal output / errors
      description: Paste any traceback from the terminal running the app.
      render: shell
    validations:
      required: false
